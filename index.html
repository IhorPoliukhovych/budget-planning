<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Сімейний фінплан</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231E5E8C'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'%3E$%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Unbounded:wght@500;700&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style id="app-css">
/* Layout: header + sticky tab bar with live totals; one tab visible at a time. Color = meaning: green in, rust out, blue saved, teal/bronze assets */
:root{
  --bg:#F2F4F6; --panel:#FFFFFF; --fg:#14202B; --muted:#5B6875; --line:#DDE3E9; --input:#F7F9FA;
  --accent:#1E5E8C; --accent-soft:#E4EEF6; --on-accent:#FFFFFF;
  --inc:#2B7A4E; --inc-soft:#E5F1E9;
  --exp:#B4512F; --exp-soft:#F8EBE5;
  --warn:#A06A0C; --warn-soft:#FBF1DC;
  --astinc:#1C8580; --astval:#A08452; --mot:#6A4BA8; --mot-soft:#EEE9F7; --teal-soft:#E2F2F1;
  --f-display:"Unbounded","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151B; --panel:#17202A; --fg:#E5EBF0; --muted:#94A3B1; --line:#283541; --input:#111920;
  --accent:#6CB2E0; --accent-soft:#1A3142; --on-accent:#0F151B; --inc:#62C38E; --inc-soft:#16302A; --exp:#EE8B6C; --exp-soft:#3A2420;
  --warn:#E2B24E; --warn-soft:#3A2F15; --astinc:#4FC3BC; --astval:#CDB07A; --mot:#B59CEB; --mot-soft:#2A2340; --teal-soft:#14302F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151B; --panel:#17202A; --fg:#E5EBF0; --muted:#94A3B1; --line:#283541; --input:#111920;
  --accent:#6CB2E0; --accent-soft:#1A3142; --on-accent:#0F151B; --inc:#62C38E; --inc-soft:#16302A; --exp:#EE8B6C; --exp-soft:#3A2420;
  --warn:#E2B24E; --warn-soft:#3A2F15; --astinc:#4FC3BC; --astval:#CDB07A; --mot:#B59CEB; --mot-soft:#2A2340; --teal-soft:#14302F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:20px 64px;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 12px}
h1{font-family:var(--f-display);font-weight:700;font-size:1.5rem;letter-spacing:-.01em;margin:0}
.hright{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.status{font-size:.82rem;color:var(--muted)}
.status.dirty{color:var(--warn);font-weight:500}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:7px 12px}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
button.primary:disabled{opacity:.45;cursor:default}
button.add{border-style:dashed;color:var(--accent);background:transparent}
button.del,button.ico{border:none;background:transparent;color:var(--muted);padding:3px 7px;font-size:1rem;line-height:1}
button.del:hover{color:var(--exp)} button.ico:hover{color:var(--accent)}
button.ico:disabled{opacity:.3;cursor:default}
button.small{font-size:.82rem;padding:5px 10px;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:none;border-radius:0;padding:6px 10px;font-size:.78rem;font-weight:600;letter-spacing:.04em;color:var(--muted);background:transparent}
.seg button.on{background:var(--accent);color:var(--on-accent)}

/* sticky nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:2px;overflow-x:auto;padding:3px;background:var(--panel);border:1px solid var(--line);border-radius:10px;max-width:100%}
.tab{border:none;background:transparent;padding:7px 14px;border-radius:7px;color:var(--muted);font-weight:500;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab.on{background:var(--accent);color:var(--on-accent)}
.mini{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.8rem;color:var(--muted)}
.mini b{font-family:var(--f-num);font-weight:600;font-variant-numeric:tabular-nums;margin-left:4px}

section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
h2{font-family:var(--f-display);font-weight:500;font-size:1.05rem;margin:0}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:6px 12px;flex-wrap:wrap}
.sechead .sum{font-family:var(--f-num);font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.sechead .sum b{color:var(--fg);font-weight:500}
h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:4px 0 0;font-weight:600;display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 8px}
h3 span{font-family:var(--f-num);letter-spacing:0;text-transform:none;font-weight:500}
.explain{font-size:.84rem;color:var(--muted);margin:0;max-width:80ch}
.note{font-size:.82rem;color:var(--muted)}
.neg{color:var(--exp)!important}
.posc{color:var(--inc)!important}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.76rem;font-weight:600;white-space:nowrap}
.pill.good{background:var(--inc-soft);color:var(--inc)} .pill.bad{background:var(--exp-soft);color:var(--exp)} .pill.mid{background:var(--warn-soft);color:var(--warn)}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px 16px;align-items:end}
.fields label,.controls label{display:flex;flex-direction:column;justify-content:flex-end;gap:4px;font-size:.8rem;color:var(--muted);min-width:0}
.fgroup{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:12px;background:var(--bg)}
#cush,#nextgoal{display:flex;flex-direction:column;gap:10px}
section[data-c]>.sechead h2::before,section[data-c]>.cardhead h2::before,.card[data-c]>.cardhead h2::before{content:'';display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:10px;vertical-align:1px;background:var(--mk)}
[data-c=inc]{--mk:var(--inc)} [data-c=exp]{--mk:var(--exp)} [data-c=acc]{--mk:var(--accent)} [data-c=teal]{--mk:var(--astinc)} [data-c=warn]{--mk:var(--warn)} [data-c=mot]{--mk:var(--mot)} [data-c=val]{--mk:var(--astval)}
section[data-c=inc]{background:linear-gradient(var(--inc-soft),var(--panel) 90px)}
section[data-c=exp]{background:linear-gradient(var(--exp-soft),var(--panel) 90px)}
section[data-c=teal]{background:linear-gradient(var(--teal-soft),var(--panel) 90px)}
section[data-c=warn]{background:linear-gradient(var(--warn-soft),var(--panel) 90px)}
section[data-c=mot]{background:linear-gradient(var(--mot-soft),var(--panel) 90px)}
section[data-c=acc]{background:linear-gradient(var(--accent-soft),var(--panel) 90px)}
.tdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px;background:var(--mk)}
.tab.on .tdot{background:var(--on-accent)}
.cell{display:contents}.ml{display:none}
.hbtns{display:inline-flex;gap:6px}
.pill.acc{background:var(--accent-soft);color:var(--accent)} .pill.mot{background:var(--mot-soft);color:var(--mot)}
.legend-types{display:flex;flex-wrap:wrap;gap:6px}
.role .rt .pill{font-size:.68rem;padding:1px 8px;margin-right:2px}
.stack{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
.stack input,.stack select{width:100%}
.sales{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:12px}
.sales table td,.sales table th{padding:6px 4px;font-size:.84rem}
.sales table th{white-space:normal;font-size:.64rem;line-height:1.3}
.sales .seg button{font-size:.74rem;padding:5px 8px;letter-spacing:0}
.resetbar{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:12px;background:var(--exp-soft);border:1px solid var(--exp)}
.resetbar .row2{display:flex;gap:8px;flex-wrap:wrap}
button.danger{background:var(--exp);border-color:var(--exp);color:var(--on-accent);font-weight:600}
.callout.mot{background:var(--mot-soft)} .callout.mot .cardbig{color:var(--mot)}
.checks{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:.88rem}
.checks label{display:flex;gap:8px;align-items:center;cursor:pointer}
.checks input{width:auto;accent-color:var(--accent);margin:0}

/* overview */
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0;border:1px solid var(--line)}
.tile.t-net{background:var(--inc-soft);border-color:transparent}
.tile.t-exp{background:var(--exp-soft);border-color:transparent}
.tile.t-sur{background:var(--accent-soft);border-color:var(--accent)}
.big{font-family:var(--f-num);font-size:1.5rem;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:4px}
.t-net .big{color:var(--inc)} .t-exp .big{color:var(--exp)} .t-sur .big{color:var(--accent)}
.yr{font-family:var(--f-num);font-size:.85rem;font-variant-numeric:tabular-nums}
.tile .note{margin-top:4px;font-size:.78rem}
.assetline{display:flex;flex-wrap:wrap;gap:4px 20px;font-size:.86rem;color:var(--muted)}
.assetline b{font-family:var(--f-num);color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.card{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.hi{border-color:var(--accent);background:var(--accent-soft)}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cardbig{font-family:var(--f-display);font-size:1.3rem;font-weight:500;line-height:1.25}
.kv{display:flex;flex-direction:column;gap:4px}
.kv div{display:flex;justify-content:space-between;align-items:baseline;gap:4px 12px;flex-wrap:wrap;font-size:.86rem;color:var(--muted)}
.kv b{font-family:var(--f-num);font-weight:500;color:var(--fg);font-variant-numeric:tabular-nums;margin-left:auto}
.kv div.tot{border-top:1px solid var(--line);padding-top:6px;margin-top:2px;color:var(--fg);font-weight:600}
.kv div.tot b{font-weight:600}
.inline{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--muted);flex-wrap:wrap}
.inline input{width:90px}

/* savings */
.controls{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:12px 16px;align-items:end}
.slide{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.slide input[type=range]{flex:1 1 160px;accent-color:var(--accent);padding:0;border:none;background:none;min-width:0}
.slide input.n{width:110px;flex:none}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.wide{min-width:600px}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;vertical-align:bottom}
td{font-family:var(--f-num);font-size:.9rem}
th:first-child,td:first-child{text-align:left;font-family:var(--f-body)}
th.l{text-align:left}
td.age{font-family:var(--f-display);font-size:.95rem;text-align:left}
td.tot{font-weight:600}
td.c-save{color:var(--accent)} td.c-ai{color:var(--astinc)} td.c-av{color:var(--astval)}
td.barcell{width:24%;min-width:120px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%}

/* goals queue */
.queue{display:flex;flex-direction:column;gap:10px}
.qi{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;border:1px solid var(--line);border-radius:12px;padding:14px;align-items:start}
.qi.off{opacity:.5}
.qi.next{border-color:var(--accent);background:var(--accent-soft)}
.qn{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-num);font-weight:600;font-size:.85rem}
.qi.next .qn{background:var(--accent);color:var(--on-accent)}
.qbody{display:flex;flex-direction:column;gap:6px;min-width:0}
.qtop{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.qname{font-weight:600}
.qtop input.gname{font-weight:600;font-size:.98rem;background:transparent;border-color:transparent;padding:4px 6px;margin-left:-6px;width:auto;min-width:120px;flex:1 1 160px}
.qtop input.gname:hover,.qtop input.gname:focus{border-color:var(--line);background:var(--input)}
.qtop input.n{width:130px}
.qwhen{font-family:var(--f-display);font-size:1.1rem;font-weight:500}
.qsub{font-size:.84rem;color:var(--muted)}
.qctl{display:flex;flex-direction:column;align-items:center;gap:2px}
.qctl label{display:flex;align-items:center;cursor:pointer;padding:3px}
.qctl input{width:auto;accent-color:var(--accent);margin:0}
.linkbtn{border:none;background:none;color:var(--accent);padding:0;font-size:.82rem;text-decoration:underline;text-underline-offset:2px}

/* what-if */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:999px;padding:5px 12px;font-size:.84rem;display:inline-flex;gap:6px;align-items:baseline}
.chip small{font-family:var(--f-num);color:var(--muted);font-size:.75rem}
.chip.off{text-decoration:line-through;opacity:.55;border-style:dashed}
.chip.inc{border-color:var(--inc)} .chip.exp{border-color:var(--exp)}
td.d-pos{color:var(--inc)} td.d-neg{color:var(--exp)}

/* motivation */
.people{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{font-size:.8rem;padding:4px 10px;border-radius:999px}
.roles{display:flex;flex-direction:column}
.role{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:4px 10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:baseline}
.role:last-child{border-bottom:none}
.role .rn{font-family:var(--f-num);color:var(--muted);font-size:.78rem}
.role .rt{font-weight:500;min-width:0}
.role .rt small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.role .rs{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:.88rem;text-align:right}
.role .rs small{display:block;color:var(--muted);font-size:.72rem}
.callout{background:var(--inc-soft);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.callout .cardbig{color:var(--inc)}

/* budget editors */
.rows{display:flex;flex-direction:column;gap:0}
.row{display:grid;gap:6px;align-items:center;padding:3px 0;border-bottom:1px solid var(--line)}
.row.head{border-bottom:none}
.rows .row:last-child{border-bottom:none}
.row input,.row select{padding:4px 8px;font-size:.88rem;border-color:transparent;background:transparent}
.row input:hover,.row select:hover,.row input:focus,.row select:focus{border-color:var(--line);background:var(--input)}
.row input.n{background:var(--input)}
.row.inc{grid-template-columns:minmax(0,1fr) 100px 140px 70px 190px 28px}
.row.ast{grid-template-columns:minmax(0,1fr) 96px 86px 140px 70px 190px 28px}
.row.exp{grid-template-columns:minmax(0,1fr) 100px 140px 190px 28px}
.row.head{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding-bottom:2px}
.row.head .r{text-align:right}
.row.head>div{white-space:nowrap}
input,select{font:inherit;font-size:.92rem;width:100%;min-width:0;border:1px solid var(--line);background:var(--input);color:var(--fg);border-radius:6px;padding:6px 8px}
input.n{font-family:var(--f-num);text-align:right;font-variant-numeric:tabular-nums}
.mo{font-family:var(--f-num);text-align:right;font-variant-numeric:tabular-nums;font-size:.92rem}
.mo small{display:inline;margin-left:8px;color:var(--muted);font-size:.72rem;font-family:var(--f-body)}
.row .mo{font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@media (max-width:860px){
  .flow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .duo,.people{grid-template-columns:1fr}
}
@media (max-width:720px){
  section{padding:16px}
  .controls{grid-template-columns:1fr 1fr}
  .controls label:first-child{grid-column:1 / 3}
  .row.head{display:none}
  .row.inc,.row.exp,.row.ast{grid-template-columns:minmax(0,1fr) 96px 28px;gap:2px 6px;padding:6px 0}
  .cell{display:contents}.ml{display:none}
  .row .c-name{grid-column:1;grid-row:1} .row .c-del{grid-column:3;grid-row:1}
  .row .c-amt input,.row .c-amt{grid-column:2;grid-row:1}
  .row .c-freq,.row .c-freq select{grid-column:1;grid-row:2}
  .row.exp .c-mo{grid-column:2 / 4;grid-row:2}
  .row.inc .c-tax,.row.inc .c-tax input{grid-column:2;grid-row:2} .row.inc .c-mo{grid-column:1 / 4;grid-row:3}
  .row.ast .c-val,.row.ast .c-val input{grid-column:2;grid-row:1} .row.ast .c-amt,.row.ast .c-amt input{grid-column:2;grid-row:2}
  .row.ast .c-freq,.row.ast .c-freq select{grid-column:1;grid-row:2} .row.ast .c-tax,.row.ast .c-tax input{grid-column:2;grid-row:3}
  .row.ast .c-mo{grid-column:1;grid-row:3}
  .row .mo{text-align:right;font-size:.82rem}
  .row.inc .c-mo,.row.ast .c-mo{text-align:left}
  .row select{font-size:.8rem;color:var(--muted)}
  .mo small{display:inline}
  .th-mix,td.barcell{display:none}
  table.wide{min-width:0}
  th,td{padding:8px 5px}
  h1{font-size:1.25rem}
  .big{font-size:1.25rem}
  .qi{grid-template-columns:28px minmax(0,1fr);}
  .qctl{grid-column:1 / -1;flex-direction:row;justify-content:flex-end}
}
</style>
</head>

const L=()=>T[S.lang]||T.uk;

const t=(k,...a)=>{const v=L()[k]!==undefined?L()[k]:T.uk[k];return typeof v==='function'?v(...a):v};

/* ================= state ================= */
const FREQN={w:52,m:12,q:4,h:2,y:1};
const HORIZONS=[1,3,5,10,15,20,30];
const DKEY='famplan-draft-v6', TKEY='famplan-tab2';

if(!S.rental){const h=S.house||{};S.rental={price:h.price||250000,dp:h.dp??25,closing:h.closing??3,rate:h.rate??7,term:30,rent:2000,taxPct:1.5,insYr:1500,hoa:250,maintPct:5,vacPct:5,mgmtPct:0,mode:'mortgage'}}
if(!S.queue){S.queue=[{id:'q-cushion',type:'cushion',on:true},{id:'q-rental',type:'rental',on:true}].concat((S.goals||[]).map(g=>({id:g.id,type:'buy',name:g.name,price:g.price,on:true})))}
D('whatif',{off:[],incDrop:0,expRise:0});
if(S.whatif.incDrop===undefined){S.whatif.incDrop=0;S.whatif.expRise=0;delete S.whatif.incPct;delete S.whatif.expPct}
S.assets.forEach(a=>{if(a.tax===undefined)a.tax=10});
if(!S.queue.some(q=>q.id==='g-gc'))S.queue.splice(1,0,{id:'g-gc',type:'buy',name:'Грін-карта',price:20000,on:true});
D('motiv',{p1:{inc:(S.incomes[0]||{}).id,extra:2000},p2:{inc:(S.incomes[1]||{}).id,extra:1000}});
[['p1','Ігор','Revenue Automation Engineer: маркетинг, реклама, CRM-автоматизація','marketing'],['p2','Катя','Графічний дизайнер','design']].forEach(([k,n,r,f])=>{const p=S.motiv[k];if(!p)return;if(p.name===undefined)p.name=n;if(p.role===undefined)p.role=r;if(!p.fam)p.fam=f});
delete S.house; delete S.goals;
if(!T[S.lang])S.lang='uk';
if(!T.uk.tabs[tab])tab='budget';

/* ================= math ================= */
const num=v=>{const x=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isFinite(x)?x:0};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const fmtN=v=>new Intl.NumberFormat(S.lang==='en'?'en-US':'uk-UA',{maximumFractionDigits:0}).format(v);
const money=v=>(v<-0.5?'−':'')+S.cur+fmtN(Math.abs(Math.round(v)));
const signed=v=>(v>0.5?'+':'')+money(v);
const pct1=v=>(v<-0.05?'−':'')+(Math.round(Math.abs(v)*10)/10).toString().replace('.',S.lang==='en'?'.':',');
const per=it=>FREQN[it.freq]||12;
const irregular=it=>['q','h','y'].includes(it.freq);
const moExp=e=>(+e.amount||0)*per(e)/12;
const moIncG=i=>(+i.amount||0)*per(i)/12;
const moIncN=i=>moIncG(i)*(1-(+i.tax||0)/100);
const moAstG=a=>(+a.income||0)*per(a)/12;
const moAst=a=>moAstG(a)*(1-(+a.tax||0)/100);
const sum=(arr,f)=>arr.reduce((s,x)=>s+f(x),0);
const whenStr=m=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+m);return t('monthNames')[d.getMonth()]+' '+d.getFullYear()};
const dur=m=>t('dur',Math.floor(m/12),m%12);

function calc(sc,mot){ // sc: stress test, mot: motivation raises
  const off=sc?new Set(S.whatif.off):new Set();
  const incs=S.incomes.filter(i=>!off.has(i.id)), exps=S.expenses.filter(e=>!off.has(e.id));
  let gross=sum(incs,moIncG), net=sum(incs,moIncN);
  if(sc){net-=(+S.whatif.incDrop||0);gross-=(+S.whatif.incDrop||0)}
  if(mot){['p1','p2'].forEach(k=>{const p=S.motiv[k],x=+p.extra||0,inc=S.incomes.find(i=>i.id===p.inc);gross+=x;net+=x*(1-((inc?+inc.tax:30)||0)/100)})}
  const stable=sum(exps.filter(e=>!irregular(e)),moExp)+(sc?(+S.whatif.expRise||0):0), irr=sum(exps.filter(irregular),moExp);
  const exp=stable+irr;
  const astInc=off.has('ast')?0:sum(S.assets,moAst);
  return {gross,net,tax:gross-net,stable,irr,exp,sur:net-exp,astInc,astValue:sum(S.assets,a=>+a.value||0)};
}
const savingRate=c=>(S.sandbox!==null&&S.sandbox!==undefined?+S.sandbox:Math.round(c.sur));
function rentalCalc(){
  const R=S.rental, price=+R.price||0, rent=+R.rent||0;
  const closing=price*(+R.closing||0)/100, loan=price*(1-(+R.dp||0)/100);
  const r=(+R.rate||0)/1200, n=Math.max(1,(+R.term||30)*12);
  const pi=loan>0?(r>0?loan*r/(1-Math.pow(1+r,-n)):loan/n):0;
  const vac=rent*(+R.vacPct||0)/100, tax=price*(+R.taxPct||0)/100/12, ins=(+R.insYr||0)/12, hoa=+R.hoa||0;
  const maint=rent*(+R.maintPct||0)/100, mgmt=rent*(+R.mgmtPct||0)/100;
  const noi=rent-vac-tax-ins-hoa-maint-mgmt;
  const share=1-((+R.vacPct||0)+(+R.maintPct||0)+(+R.mgmtPct||0))/100;
  const fixed=tax+ins+hoa;
  const mk=(mortgage)=>{const cf=noi-(mortgage?pi:0), cash=mortgage?price*(+R.dp||0)/100+closing:price+closing;
    return {mortgage,cf,cash,coc:cash>0?cf*12/cash*100:0,be:share>0?(fixed+(mortgage?pi:0))/share:0,loan:mortgage?loan:0,pi:mortgage?pi:0}};
  return {rent,vac,tax,ins,hoa,maint,mgmt,noi,cap:price>0?noi*12/price*100:0,m:mk(true),c:mk(false)};
}
function queueItems(c){
  const rc=rentalCalc(), mode=S.rental.mode==='cash'?rc.c:rc.m;
  return S.queue.filter(q=>q.on).map(q=>{
    if(q.type==='cushion')return {q,need:Math.max(0,(+S.cushion.months||0)*c.exp),cf:0};
    if(q.type==='rental')return {q,need:mode.cash,cf:mode.cf};
    return {q,need:+q.price||0,cf:0};
  });
}
function runQueue(items,rate,have){
  let free=have,cf=0,idx=0;const res=items.map(()=>null);
  for(let m=0;m<=720&&idx<items.length;m++){
    if(m>0)free+=rate+cf;
    while(idx<items.length&&free>=items[idx].need-0.5){free-=items[idx].need;cf+=items[idx].cf;res[idx]=m;idx++}
    if(m>24&&rate+cf<=0&&idx<items.length&&free<items[idx].need)break;
  }
  return res;
}
const goalsHave=c=>(+S.startSavings||0)+(S.sellAst?c.astValue:0);
const goalsRate=(c,base)=>(base!==undefined?base:savingRate(c))+(S.useAst?c.astInc:0);
const itemName=q=>q.type==='cushion'?t('cushionItem'):q.type==='rental'?t('rentalItem'):(q.name||t('newGoal'));

        ${STANDALONE?`<span class="hbtns"><button class="small" data-act="export">${t('exportBtn')}</button>${VAULT?`<button class="small" data-act="vault">${t('vaultBtn')}</button>`:`<button class="small" data-act="import">${t('importBtn')}</button>`}<input type="file" id="impfile" accept="application/json,.json" hidden></span>`:''}

    <div class="nav"><div class="tabs" role="tablist">${tabs}</div><div class="mini" id="mini"></div></div>
    ${({overview:vOverview,goals:vGoals,rental:vRental,whatif:vWhatif,budget:vBudget,motiv:vMotiv})[tab]()}

  renderCalc(); renderStatus();
}

/* ---------- what-if ---------- */
function vWhatif(){const off=new Set(S.whatif.off);
  const chip=(id,label,amt,cls)=>`<button class="chip ${cls}${off.has(id)?' off':''}" data-act="wtoggle" data-id="${id}" aria-pressed="${!off.has(id)}">${esc(label)} <small>${amt}</small></button>`;
  return `
  <section data-c="warn">
    <div class="sechead"><h2>${t('wiTitle')}</h2><button class="small" data-act="wreset">${t('wiReset')}</button></div>
    <p class="explain">${t('wiExplain')}</p>
    <h3>${t('wiInc')}</h3>
    <div class="chips">${S.incomes.map(i=>chip(i.id,i.name||t('name'),money(moIncN(i)),'inc')).join('')}${S.assets.length?chip('ast',t('wiAst'),money(sum(S.assets,moAst)),'inc'):''}</div>
    <h3>${t('wiExp')}</h3>
    <div class="chips">${[...S.expenses].sort((a,b)=>moExp(b)-moExp(a)).map(e=>chip(e.id,e.name||t('name'),money(moExp(e)),'exp')).join('')}</div>
    <div class="fields"><label>${t('wiIncPct')}${inpP('whatif','incDrop',t('wiIncPct'))}</label><label>${t('wiExpPct')}${inpP('whatif','expRise',t('wiExpPct'))}</label></div>
    <div class="tablewrap"><table id="wi-table"></table></div>
  </section>`}

/* ---------- budget ---------- */
function vBudget(){
  const stable=S.expenses.filter(e=>!irregular(e)), irr=S.expenses.filter(irregular);
  const expHead=`<div class="row exp head"><div>${t('hItem')}</div><div class="r">${t('hAmount')}</div><div>${t('hFreq')}</div><div class="r">${t('hPerMo')}</div><div></div></div>`;
  const cell=(lbl,h,cls)=>`<label class="cell ${cls}"><span class="ml">${lbl}</span>${h}</label>`;
  const rowInc=i=>`<div class="row inc"><div class="c-name">${inpB('incomes',i,'name',t('name'))}</div>${cell(t('hGross'),inpB('incomes',i,'amount',t('hGross'),1),'c-amt')}${cell(t('hFreq'),freqSel('incomes',i),'c-freq')}${cell(t('hTax'),inpB('incomes',i,'tax',t('hTax'),1),'c-tax')}<div class="mo c-mo" data-mo="${i.id}"></div>${delBtn('incomes',i)}</div>`;
  const rowAst=a=>`<div class="row ast"><div class="c-name">${inpB('assets',a,'name',t('name'))}</div>${cell(t('hValue'),inpB('assets',a,'value',t('hValue'),1),'c-val')}${cell(t('hIncome'),inpB('assets',a,'income',t('hIncome'),1),'c-amt')}${cell(t('hFreq'),freqSel('assets',a),'c-freq')}${cell(t('hTax'),inpB('assets',a,'tax',t('hTax'),1),'c-tax')}<div class="mo c-mo" data-mo="${a.id}"></div>${delBtn('assets',a)}</div>`;
  const rowExp=e=>`<div class="row exp"><div class="c-name">${inpB('expenses',e,'name',t('name'))}</div>${cell(t('hAmount'),inpB('expenses',e,'amount',t('hAmount'),1),'c-amt')}${cell(t('hFreq'),freqSel('expenses',e),'c-freq')}<div class="mo c-mo" data-mo="${e.id}"></div>${delBtn('expenses',e)}</div>`;
  return `
  ${resetAsk?`<div class="resetbar"><b>${t('resetAsk')}</b><span class="note">${t('resetTip')}</span><div class="row2"><button class="danger" data-act="resetyes">${t('resetYes')}</button><button data-act="resetno">${t('resetNo')}</button></div></div>`
    :`<div style="display:flex;justify-content:flex-end"><button class="small" data-act="reset">↺ ${t('resetBtn')}</button></div>`}
  <section data-c="inc"><div class="sechead"><h2>${t('incomeTitle')}</h2><div class="sum" id="sum-inc"></div></div>
    <h3>${t('earnings')}</h3>
    <div class="rows"><div class="row inc head"><div>${t('hSource')}</div><div class="r">${t('hGross')}</div><div>${t('hFreq')}</div><div class="r">${t('hTax')}</div><div class="r">${t('hNet')}</div><div></div></div>${S.incomes.map(rowInc).join('')}</div>
    <div><button class="add" data-act="add" data-l="incomes">${t('addIncome')}</button></div>
    <h3>${t('assetsH')} <span id="sum-ast"></span></h3>
    <div class="rows"><div class="row ast head"><div>${t('hAsset')}</div><div class="r">${t('hValue')}</div><div class="r">${t('hIncome')}</div><div>${t('hFreq')}</div><div class="r">${t('hTax')}</div><div class="r">${t('hNetAst')}</div><div></div></div>${S.assets.map(rowAst).join('')}</div>
    <div><button class="add" data-act="add" data-l="assets">${t('addAsset')}</button></div>
  </section>
  <section data-c="exp"><div class="sechead"><h2>${t('expensesTitle')}</h2><div class="sum" id="sum-exp"></div></div>
    <h3>${t('monthly')} <span id="sum-stable"></span></h3>
    <div class="rows">${expHead}${stable.map(rowExp).join('')}</div>
    <div><button class="add" data-act="add" data-l="expenses" data-k="m">${t('addMonthly')}</button></div>
    <h3>${t('irregular')} <span id="sum-irr"></span></h3>
    <div class="rows">${expHead}${irr.map(rowExp).join('')}</div>
    <div><button class="add" data-act="add" data-l="expenses" data-k="y">${t('addIrregular')}</button></div>
  </section>`}

    set('qres-'+q.id,goalResultHTML(it,m,have,age,extra));
    const el=$('qi-'+q.id);if(el&&i===nextIdx)el.classList.add('next');
  });
  S.queue.filter(q=>!q.on).forEach(q=>{set('qres-'+q.id,'');if(q.type!=='buy'){const it=queueItemsAll(c).find(x=>x.q.id===q.id);if(it)set('qneed-'+q.id,`${t('needLbl')} <b style="font-family:var(--f-num)">${money(it.need)}</b>`)}});
}
function queueItemsAll(c){const save=S.queue;S.queue=save.map(q=>Object.assign({},q,{on:true}));const r=queueItems(c);S.queue=save;return r}
function cRental(){
  const rc=rentalCalc(), R=S.rental;
  const card=(o,title,key)=>{const good=o.cf>=0;
    const line=(l,v,cls)=>`<div><span>${l}</span><b class="${cls||''}">${v}</b></div>`;
    return `<div class="card${R.mode===key?' hi':''}">
      <div class="cardhead"><h2>${title}</h2><span class="pill ${good?'good':'bad'}">${good?t('vGood'):t('vBad',money(-o.cf))}</span></div>
      <div class="kv">
        ${line(t('rRent'),money(rc.rent))}
        ${rc.vac?line(t('rVac'),'−'+money(rc.vac).replace('−','')):''}
        ${o.pi?line(t('rMort'),'−'+money(o.pi)):''}
        ${line(t('rTax'),'−'+money(rc.tax))}${line(t('rIns'),'−'+money(rc.ins))}
        ${rc.hoa?line(t('rHoa'),'−'+money(rc.hoa)):''}${rc.maint?line(t('rMaint'),'−'+money(rc.maint)):''}${rc.mgmt?line(t('rMgmt'),'−'+money(rc.mgmt)):''}
        <div class="tot"><span>${t('rCf')}</span><b class="${good?'posc':'neg'}">${signed(o.cf)}</b></div>
      </div>
      <div class="kv">
        ${line(t('rCash'),money(o.cash))}
        ${line(t('rCoc'),pct1(o.coc)+'%',o.coc<0?'neg':'')}
        ${line(t('rCap'),pct1(rc.cap)+'%')}
        ${line(t('rBe'),money(o.be)+' '+t('perMo'))}
      </div>
      ${R.mode===key?`<div class="note">✓ ${t('inGoals')}</div>`:`<div><button class="small" data-act="rmode" data-k="${key}">${t('useInGoals')}</button></div>`}
    </div>`};
  set('rental-res',card(rc.m,t('withMortgage'),'mortgage')+card(rc.c,t('allCash'),'cash'));
}
function cWhatif(c,ci){
  const s=calc(true), off=new Set(S.whatif.off);
  const rateB=c.sur+(S.useAst?c.astInc:0), rateS=s.sur+(S.useAst?s.astInc:0);
  const have=+S.startSavings||0;
  const run=x=>x.sur>=0?t('wRunInf'):t('months',pct1(have/(-x.sur)));
  const cov=x=>x.exp>0?t('months',pct1(have/x.exp)):'—';
  const row=(l,a,b,money_)=>{const d=b-a;return `<tr><td>${l}</td><td>${money(a)}</td><td>${money(b)}</td><td class="${Math.abs(d)<0.5?'':(d>0)===money_?'d-pos':'d-neg'}">${Math.abs(d)<0.5?'—':signed(d)}</td></tr>`};
  const itB=queueItems(c), itS=queueItems(s), rB=runQueue(itB,rateB,goalsHave(c)), rS=runQueue(itS,rateS,goalsHave(s));
  const w=m=>m===null?`<span class="neg">${t('never')}</span>`:m===0?t('now'):whenStr(m);
  set('wi-table',`<thead><tr><th></th><th>${t('colNow')}</th><th>${t('colScen')}</th><th>${t('colDiff')}</th></tr></thead><tbody>
    ${row(t('wNet'),c.net,s.net,true)}${row(t('wExp'),c.exp,s.exp,false)}${row(t('wSur'),c.sur,s.sur,true)}${row(t('wRate'),rateB,rateS,true)}
    <tr><td>${t('wCush')}</td><td>${cov(c)}</td><td>${cov(s)}</td><td></td></tr>
    <tr><td>${t('wRun')}</td><td>${run(c)}</td><td class="${s.sur<0?'neg':''}">${run(s)}</td><td></td></tr>
    <tr><th class="l" colspan="4" style="padding-top:16px">${t('wGoals')}</th></tr>
    ${itB.map((it,i)=>`<tr><td>${esc(itemName(it.q))}</td><td>${w(rB[i])}</td><td>${w(rS[i])}</td><td>${rB[i]!==null&&rS[i]!==null&&rB[i]!==rS[i]?`<span class="${rS[i]<rB[i]?'posc':'neg'}">${rS[i]<rB[i]?'−':'+'}${dur(Math.abs(rS[i]-rB[i]))}</span>`:''}</td></tr>`).join('')}
  </tbody>`);
}
function cBudget(c){
  S.incomes.forEach(i=>set_mo(i.id,`${money(moIncN(i))}<small>${t('grossSmall',money(moIncG(i)))}</small>`));
  S.assets.forEach(a=>set_mo(a.id,`${money(moAst(a))}<small>${a.value>0?t('yieldSmall',pct1(moAst(a)*12/a.value*100)):t('grossSmall',money(moAstG(a)))}</small>`));
  S.expenses.forEach(e=>set_mo(e.id,`${money(moExp(e))}<small>${t('perYrSmall',money(moExp(e)*12))}</small>`));
  set('sum-inc',`<b>${money(c.net)}</b> ${t('perMo')}`);
  set('sum-ast',`${money(c.astValue)} · ${money(c.astInc)} ${t('perMo')}`);
  set('sum-exp',`<b>${money(c.exp)}</b> ${t('perMo')} · ${money(c.exp*12)} ${t('perYr')}`);
  set('sum-stable',money(c.stable)+' '+t('perMo'));
  set('sum-irr',money(c.irr)+' '+t('perMo'));
}
function set_mo(id,h){const el=document.querySelector(`[data-mo="${id}"]`);if(el)el.innerHTML=h}

/* ================= saving ================= */
function renderStatus(){
  const st=$('status'), b=$('savebtn'); if(!st)return;
  if(saving){st.textContent=t('saving');st.className='status';b.disabled=true;return}
  if(STANDALONE){st.textContent=t('autoSaved');st.className='status';b.hidden=true;return}
  if(dirty){st.textContent=art?t('unsaved'):t('localOnly');st.className='status dirty'}
  else{st.textContent=S.savedAt?t('savedAt',new Date(S.savedAt).toLocaleString(S.lang==='en'?'en-US':'uk-UA',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})):'';st.className='status'}
  b.hidden=!art; b.disabled=!dirty;
}
function markDirty(){dirty=true;try{localStorage.setItem(DKEY,JSON.stringify({base:embedded.savedAt,state:S}))}catch(e){}renderStatus()}
async function save(){
  if(!art||saving)return; saving=true; renderStatus();
  const st=JSON.parse(JSON.stringify(S)); st.savedAt=Date.now();
  const json=JSON.stringify(st).replace(/</g,'\\u003c');
  const css=$('app-css').textContent, js=$('app-js').textContent;
  const fonts=[...document.querySelectorAll('link[href*="fonts.g"]')].map(l=>l.outerHTML).join('');
  const html='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>'
    +'<title>Сімейний фінплан</title>'+fonts+'<style id="app-css">'+css+'</style><div id="app"></div><script type="application/json" id="state">'+json+'<\/script><script id="app-js">'+js+'<\/script></body></html>';
  try{try{localStorage.removeItem(DKEY)}catch(e){} await art.publish(html)}
  catch(e){saving=false;
    try{localStorage.setItem(DKEY,JSON.stringify({base:embedded.savedAt,state:S}))}catch(_){}
    renderStatus();const s=$('status');if(s)s.textContent=(e&&e.code==='conflict')?t('conflict'):t('saveFail');}
}

/* ================= events ================= */
document.addEventListener('input',e=>{const x=e.target;
  if(x.type==='checkbox'&&x.id&&x.id.startsWith('c-')){S[x.id.slice(2)]=x.checked;markDirty();renderCalc();return}
  if(x.dataset.act==='qon'){const q=S.queue.find(q=>q.id===x.dataset.id);if(q){q.on=x.checked;markDirty();$('qi-'+q.id).classList.toggle('off',!q.on);renderCalc()}return}
  if(x.id==='sb-range'||x.id==='sb-num'){S.sandbox=num(x.value);markDirty();renderSandbox(calc(),x.id==='sb-range'?'range':'num');return}
  if(x.dataset.mot){const k=x.dataset.mot,f=x.dataset.f,p=S.motiv[k];p[f]=f==='extra'?num(x.value):x.value;
    if(f==='fam')p.famManual=true;
    if(f==='commPct')p.commPct=num(x.value);
    if(f==='role'&&!p.famManual){const d=detectFam(x.value);if(d!=='other'||!x.value.trim()){p.fam=d;const sel=$('mfam-'+k);if(sel)sel.value=d}}
    markDirty();renderCalc();return}
  const f=x.dataset&&x.dataset.f;if(!f)return;
  const v=x.dataset.t==='n'?num(x.value):x.value;
  if(x.dataset.p!==undefined){if(x.dataset.p)S[x.dataset.p][f]=v;else S[f]=v}
  else{const it=S[x.dataset.l].find(o=>o.id===x.dataset.id);if(!it)return;it[f]=v}
  markDirty(); if(f==='freq')renderAll(); else renderCalc();
});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT')return;const a=b.dataset.act,l=b.dataset.l;
  if(a==='tab'){tab=b.dataset.k;try{localStorage.setItem(TKEY,tab)}catch(_){}renderAll();window.scrollTo({top:0});return}
  if(a==='lang'){S.lang=b.dataset.k;markDirty();renderAll();return}
  if(a==='add'){
    if(l==='assets')S.assets.push({id:uid(),name:'',value:0,income:0,freq:'m',tax:10});
    else if(l==='incomes')S.incomes.push({id:uid(),name:'',amount:0,freq:'m',tax:30});
    else if(l==='queue')S.queue.push({id:uid(),type:'buy',name:'',price:0,on:true});
    else S.expenses.push({id:uid(),name:'',amount:0,freq:b.dataset.k||'m'});
    markDirty();renderAll();
    const ins=document.querySelectorAll(`input[data-l="${l}"][data-f="name"]`);if(ins.length)ins[ins.length-1].focus();
  } else if(a==='del'){S[l]=S[l].filter(o=>o.id!==b.dataset.id);markDirty();renderAll()}
  else if(a==='qup'||a==='qdown'){const i=S.queue.findIndex(q=>q.id===b.dataset.id),j=a==='qup'?i-1:i+1;if(i<0||j<0||j>=S.queue.length)return;
    [S.queue[i],S.queue[j]]=[S.queue[j],S.queue[i]];markDirty();renderAll()}
  else if(a==='rmode'){S.rental.mode=b.dataset.k;markDirty();renderCalc()}
  else if(a==='wtoggle'){const id=b.dataset.id,o=new Set(S.whatif.off);o.has(id)?o.delete(id):o.add(id);S.whatif.off=[...o];
    b.classList.toggle('off',o.has(id));b.setAttribute('aria-pressed',String(!o.has(id)));markDirty();renderCalc()}
  else if(a==='wreset'){S.whatif={off:[],incDrop:0,expRise:0};markDirty();renderAll()}
  else if(a==='mai'){askAI(b.dataset.k)}
  else if(a==='sbase'){S.motiv[b.dataset.k].salesBase=b.dataset.v;b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));markDirty();renderCalc()}
  else if(a==='reset'){resetAsk=true;renderAll()}
  else if(a==='vault'){vaultAsk=true;renderAll();const el=$('vaultpw');if(el)el.focus()}
  else if(a==='vaultno'){vaultAsk=false;renderAll()}
  else if(a==='resetno'){resetAsk=false;renderAll()}
  else if(a==='resetyes'){resetAsk=false;resetPlan();markDirty();renderAll()}
  else if(a==='mcat'){S.motiv[b.dataset.k].showAi=false;markDirty();renderPaths(b.dataset.k)}
  else if(a==='mpreset'){S.motiv[b.dataset.k].extra=+b.dataset.v;const el=$('mx-'+b.dataset.k);if(el)el.value=b.dataset.v;markDirty();renderCalc()}
  else if(a==='sbreset'){S.sandbox=null;markDirty();renderSandbox(calc())}
  else if(a==='save')save();
  else if(a==='export'){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download='family-plan-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
  else if(a==='import'){$('impfile').click()}
});
document.addEventListener('submit',async e=>{if(e.target.id!=='vaultform')return;e.preventDefault();
  const msg=$('vaultmsg'),pw=$('vaultpw').value;msg.textContent=t('vaultBusy');msg.className='note';
  try{const d=await unlockVault(pw);S=d;markDirty();location.reload()}
  catch(_){await new Promise(r=>setTimeout(r,800));msg.textContent=t('vaultWrong');msg.className='note neg';$('vaultpw').select()}
});
document.addEventListener('change',e=>{if(e.target.id!=='impfile'||!e.target.files[0])return;const fr=new FileReader();
  fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!Array.isArray(d.incomes)||!Array.isArray(d.expenses))throw 0;S=d;markDirty();location.reload()}catch(_){const s=$('status');if(s)s.textContent=t('importErr')}};
  fr.readAsText(e.target.files[0])});
renderAll();
if(window.claude&&window.claude.use){window.claude.use('artifact').then(a=>{art=a;STANDALONE=false;renderStatus()}).catch(()=>{});window.claude.use('sample').then(f=>{sampleFn=f;if(f&&tab==='motiv')renderCalc()}).catch(()=>{})}
})();
</script>
